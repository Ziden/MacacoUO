# A frequência entre os reabastecimentos dos vendedores.
# Padrão: 1 hora
# Formato: minutos
RestockDelay=10

# A quantidade que um vendedor aceitará de jogadores de uma só vez.
# Padrão: 500
MaxSell=0

# Sistema de Economia do Vendedor, publicação 21
# isso determina quantos de um item precisam ser comprados para que o preço aumente
BuyItemChange=100

# isso determina quantos de um item precisam ser vendidos para que o preço diminua
SellItemChange=1

# isso determina a quantidade de itens econômicos empilhados que são estocados
EconomyStockAmount=500

# essas configurações são o tempo mínimo e máximo (em dias) para o multiplicador de suborno decair
BribeDecayMinTime=25
BribeDecayMaxTime=30
