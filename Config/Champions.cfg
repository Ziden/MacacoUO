# Conteúdo do quarto arquivo original com as linhas traduzidas.
file_content_4 = 
# Se verdadeiro, o sistema de campeões será ativado. Se isso for falso no início do servidor, todos os spawns de campeões serão removidos.
Enabled=true

# O tempo entre a rotação dos campeões de Felucca / T2A
# Padrão: 1 dia.
# Formato: dd:hh:mm:ss 
RotateDelay=01:00:00:00

# O número de pilhas de ouro que surgem para a chuva de ouro do campeão
GoldPiles=50

# A quantidade mínima de ouro em uma pilha para a chuva de ouro
GoldMin=4000

# A quantidade máxima de ouro em uma pilha para a chuva de ouro
GoldMax=5500

# O número de pilhas de ouro que surgem para a chuva de ouro do Harrower
HarrowerGoldPiles=75

# A quantidade mínima de ouro em uma pilha para a chuva de ouro
HarrowerGoldMin=5000

# A quantidade máxima de ouro em uma pilha para a chuva de ouro
HarrowerGoldMax=10000

# O número de pergaminhos de poder a serem concedidos após a derrota de um campeão. Note que para cada pergaminho de poder concedido, um também é dado para proteção.
PowerScrolls=0

# O número de pergaminhos de estatísticas a serem concedidos após a derrota do Harrower.
StatScrolls=0

# Percentual de chance de obter um Pergaminho de Transcendência ou Pergaminho de Poder ao matar um mob de spawn
ScrollChance=0.1

# Percentual de chance de que um pergaminho concedido por uma morte de mob de spawn seja um Pergaminho de Transcendência em vez de um Pergaminho de Poder +5
TranscendenceChance=50.0

# Quantos crânios vermelhos são necessários para mover o spawn para o nível 2
Rank2RedSkulls=5

# Quantos crânios vermelhos são necessários para mover o spawn para o nível 3
Rank3RedSkulls=10

# Quantos crânios vermelhos são necessários para mover o spawn para o nível 4 (com 17 crânios vermelhos o campeão sempre aparecerá)
Rank4RedSkulls=13

# Número de mortes necessárias para avançar de nível enquanto está no nível 1
Rank1MaxKills=256

# Número de mortes necessárias para avançar de nível enquanto está no nível 2
Rank2MaxKills=128

# Número de mortes necessárias para avançar de nível enquanto está no nível 3
Rank3MaxKills=64

# Número de mortes necessárias para avançar de nível enquanto está no nível 4
Rank4MaxKills=32

